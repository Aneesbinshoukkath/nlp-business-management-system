<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - BizCore NLP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/static/manifest.json">
</head>
<body class="bg-gradient-to-b from-[#071929] via-[#092238] to-[#040e18] min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6">
    <!-- Header / Logo -->
    <div class="flex items-center space-x-3">
      <div class="w-12 h-12 rounded-2xl bg-[#00897b] flex items-center justify-center text-white shadow-md">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">BizCore NLP</h1>
      </div>
    </div>

    <div>
      <h2 class="text-2xl font-bold text-slate-900">Sign in</h2>
      <p class="text-sm text-slate-500 mt-1">Use a demo account below to explore.</p>
    </div>

    {% if error %}
    <div class="p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl">
      {{ error }}
    </div>
    {% endif %}

    <!-- Form -->
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
        <input type="email" id="emailInput" name="email" required
          class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#00897b] text-slate-900 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="passwordInput" name="password" required
          class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#00897b] text-slate-900 text-sm">
      </div>

      <button type="submit" 
        class="w-full bg-[#00897b] hover:bg-[#00796b] text-white font-semibold py-3.5 rounded-2xl shadow transition text-sm">
        Sign in
      </button>
    </form>

    <!-- Demo Accounts Quick Select -->
    <div class="space-y-2 pt-2">
      <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Demo Accounts</span>
      
      <!-- Admin Card -->
      <div onclick="fillDemo('admin@bizcore.dev', 'admin123')"
        class="flex items-center justify-between p-3.5 border border-slate-200 rounded-2xl cursor-pointer hover:border-[#00897b] hover:bg-slate-50 transition">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-full bg-teal-50 text-[#00897b] flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          </div>
          <div>
            <div class="font-bold text-xs text-slate-900">Admin</div>
            <div class="text-[11px] text-slate-500">admin@bizcore.dev · admin123</div>
          </div>
        </div>
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </div>

      <!-- Employee Card -->
      <div onclick="fillDemo('employee@bizcore.dev', 'employee123')"
        class="flex items-center justify-between p-3.5 border border-slate-200 rounded-2xl cursor-pointer hover:border-[#00897b] hover:bg-slate-50 transition">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <div>
            <div class="font-bold text-xs text-slate-900">Employee</div>
            <div class="text-[11px] text-slate-500">employee@bizcore.dev · employee123</div>
          </div>
        </div>
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(email, pass) {
      document.getElementById('emailInput').value = email;
      document.getElementById('passwordInput').value = pass;
    }
  </script>
</body>
</html>
