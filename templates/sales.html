{% extends "layout.html" %}
{% set title = "Sales" %}
{% block content %}
<div class="flex justify-between items-center mb-2">
  <span class="text-xs text-slate-500">{{ sales|length }} transactions</span>
  <button onclick="document.getElementById('saleModal').classList.remove('hidden')" class="bg-[#00897b] text-white text-xs px-3 py-1.5 rounded-xl font-semibold shadow hover:bg-[#00796b]">
    + New Sale
  </button>
</div>

<div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-sm divide-y divide-slate-100">
  {% for s in sales %}
  <div class="flex items-center justify-between py-3">
    <div>
      <div class="text-xs font-bold text-slate-900">{{ s.invoice_no }}</div>
      <div class="text-[11px] text-slate-400">{{ s.sale_date }} · {{ s.payment_method }}</div>
    </div>
    <span class="text-sm font-extrabold text-slate-900">${{ "%.2f"|format(s.total_amount) }}</span>
  </div>
  {% endfor %}
</div>

<!-- Modal -->
<div id="saleModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
  <form action="/sales" method="POST" class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-xl">
    <h3 class="font-bold text-base text-slate-900">Record Transaction</h3>
    <input type="text" name="invoice_no" placeholder="Invoice No (e.g. INV-5040)" required class="w-full text-xs p-3 border rounded-xl">
    <input type="number" step="0.01" name="amount" placeholder="Amount ($)" required class="w-full text-xs p-3 border rounded-xl">
    <select name="method" class="w-full text-xs p-3 border rounded-xl bg-white text-slate-700">
      <option value="Card">Card</option>
      <option value="UPI">UPI</option>
      <option value="Cash">Cash</option>
    </select>
    <div class="flex gap-2">
      <button type="button" onclick="document.getElementById('saleModal').classList.add('hidden')" class="w-1/2 bg-slate-100 text-slate-700 text-xs py-2 rounded-xl">Cancel</button>
      <button type="submit" class="w-1/2 bg-[#00897b] text-white text-xs py-2 rounded-xl font-semibold">Record</button>
    </div>
  </form>
</div>
{% endblock %}
